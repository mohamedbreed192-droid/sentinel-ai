name: Verify SENTINEL AI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements.lock}
      - run: pip install -r backend/requirements.lock
      - name: Import, graph, scanner, redaction, persistence and API checks
        working-directory: backend
        run: PYTHONPATH=. pytest -q
      - name: Semgrep portability diagnostics
        if: failure()
        run: |
          semgrep scan --config backend/sentinel/rules.yml --json --metrics=off --disable-version-check fixtures/demo > semgrep-diagnostic.json 2> semgrep-diagnostic.log || true
          python - <<'PY'
          import json
          from pathlib import Path
          text=Path('semgrep-diagnostic.log').read_text().replace('SENTINEL_SYNTHETIC_CREDENTIAL_DO_NOT_USE','[REDACTED]')
          print(text[-4000:])
          try:
              data=json.loads(Path('semgrep-diagnostic.json').read_text())
              print('Scanner errors:', data.get('errors', []))
          except ValueError:
              print('No JSON output')
          PY
      - name: Migration smoke check
        working-directory: backend
        run: alembic upgrade head
      - name: Full advisory report
        run: pip-audit -r backend/requirements.lock --no-deps --disable-pip --format=json > python-audit.json || test -s python-audit.json
      - name: Enforce documented, expiring dependency baseline
        run: python scripts/check_dependency_baseline.py python-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: python-dependency-audit, path: python-audit.json}
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm run build && npm audit
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: dashboard-screenshots, path: docs/screenshots/}
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ephemeral secrets
        run: |
          python - <<'PY'
          import secrets
          from pathlib import Path
          password=secrets.token_hex(24)
          Path('.env').write_text('POSTGRES_PASSWORD='+password+'\nDATABASE_URL=postgresql+psycopg://sentinel:'+password+'@postgres:5432/sentinel\nREDIS_URL=redis://redis:6379/0\nAPI_TOKEN='+secrets.token_hex(24)+'\n')
          PY
      - run: docker compose up --build -d
      - name: Container startup diagnostics
        if: failure()
        run: docker compose logs --tail=60 migrate api worker
      - name: API readiness and PostgreSQL migration
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8001/health; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8001/health
          curl --fail http://127.0.0.1:3000
      - name: Test sandbox fixture
        run: |
          docker build -f scripts/test-sandbox.Dockerfile -t sentinel-test-sandbox:local .
          python scripts/run_isolated_tests.py fixtures/sandbox --enable-untrusted-tests
      - run: docker compose down
        if: always()
